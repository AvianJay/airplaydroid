# JVM for the Gradle daemon. 4g is comfortable for AGP 9 + Compose.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is opt-in in Gradle 9. Start with problems=warn so a
# scaffolding hiccup does not hard-fail the build; tighten to `fail` once green.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official

android.useAndroidX=true

# ---------------------------------------------------------------------------
# Versioning and the in-app updater.
# ---------------------------------------------------------------------------

# Base semantic version. A release build replaces this with its git tag; a
# nightly appends its commit count and short hash (see app/build.gradle.kts).
app.version.base=0.1.0

# The GitHub repository the updater reads releases from, as owner/name. The
# manifest URLs are derived from it, so a fork only has to change this line.
app.update.repository=AvianJay/airplaydroid

# Where releases are published, for the "open the release page" link in the
# updater UI. Kept separate from the repository above because a project could
# host its downloads elsewhere.
app.update.releasesPage=https://github.com/AvianJay/airplaydroid/releases
