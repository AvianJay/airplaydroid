# JVM for the Gradle daemon. 4g is comfortable for AGP 9 + Compose.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is opt-in in Gradle 9. Start with problems=warn so a
# scaffolding hiccup does not hard-fail the build; tighten to `fail` once green.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official

android.useAndroidX=true
